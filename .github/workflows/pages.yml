name: Site on GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild when the UI library changes (sent from openasy/ui with repository_dispatch).
  repository_dispatch:
    types: [ui-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: site

      # @openasy/ui is linked from ../ui until it is published to npm.
      - uses: actions/checkout@v5
        with:
          repository: openasy/ui
          path: ui

      # Product API descriptions are read from ../vpn-manager, ../vulns and ../infra openapi.json at build time.
      - uses: actions/checkout@v5
        with:
          repository: openasy/vpn-manager
          path: vpn-manager
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v5
        with:
          repository: openasy/vulns
          path: vulns
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v5
        with:
          repository: openasy/infra
          path: infra
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            ui/package-lock.json

      - name: Build @openasy/ui
        working-directory: ui
        run: npm ci && npm run build

      - working-directory: site
        run: npm ci

      - working-directory: site
        run: npm run typecheck

      - working-directory: site
        run: npm test

      - name: Build and prerender every page
        working-directory: site
        run: |
          npm run build
          cp build/client/__spa-fallback.html build/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
